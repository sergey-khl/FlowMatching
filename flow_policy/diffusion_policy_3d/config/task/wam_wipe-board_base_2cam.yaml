name: wam_wipe-board_base_2cam

task_name: wam_wipe-board_base_2cam

image_shape: &image_shape [3, 224, 224]

# only sparse obs implemented for now

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    front_img:
        shape: *image_shape
        type: rgb
    wrist_img:
        shape: *image_shape
        type: rgb
    state:
      shape: [16] # [...7dofjp, ...ee pos, ...2x3 rows of rotation matrix]
      type: low_dim
  action:
    shape: [7]
  sample:
    # (ms) time held free at the end of each episode so every sparse query still has room for its full action horizon.
    training_duration_per_sparse_query: 6000
    obs:
      sparse:
        # down_sample_steps: how many raw steps to skip in that key's own channel
        # horizon: how many downsampled steps to look back, for this usage
        # low dim data is 500hz (https://github.com/yifan-hou/cr-dagger/blob/00700d6513b646719f003a28b488aff593eb663f/PyriteML/online_learning/configs/config_v1.py#L18) and img data is 60hz (https://github.com/yifan-hou/cr-dagger/blob/main/PyriteUtility/PyriteUtility/hardware_interface/multi_uvc_camera.py).
        # how long things take = (down_sample_steps * (horizon - 1))/hz
        state: # last 0.2s of low_dim
          horizon: 3
          down_sample_steps: 50
          source: low_dim
        front_img: # just use 1 image
          horizon: 1
          down_sample_steps: 1 # NOTE: this will likely have to change if horizon is not 1
          source: img
        wrist_img:
          horizon: 1
          down_sample_steps: 1
          source: img
    action:
      sparse:
        horizon: ${horizon}
        down_sample_steps: 50

env_runner:
  _target_: diffusion_policy_3d.env_runner.base_udp_runner.BaseUdpRunner
  remote_ip: "127.0.0.1"
  follower_send_port: 20000
  leader_send_port: 10000
  recv_port: 6554
  wrist_cam_serial: "18475182"
  front_cam_serial: "18475176"
  dof: 7
  loop_hz: 500
  debug: False
  shape_meta: *shape_meta
  n_action_steps: ${n_action_steps}
  action_size: 7

# down_sample_steps: how many steps to skip in the raw data for the given usage
# horizon: how many steps to look ahead(action) or back(obs) after downsample for the given usage
dataset:
  _target_: diffusion_policy_3d.dataset.lab_real_async_dataset.LabRealAsyncDataset
  zarr_path: /mnt/10tb/serg/FlowMatching/data_wam/wam_wipe-board-81_nocorr-1.zarr
  shape_meta: *shape_meta
  action_padding: False
  query_frequency_down_sample_steps: 1 # paper has this as 8 but we do our own downsampling in the data conversion script
  correction_upsampling:
    enabled: False
    threshold: 1.0 # importance power
    lookback_horizon: 5         # how many frames back to check for the "was in correction" average
    lookback_down_sample_steps: 1
    weighted_sampling: 4          # duplicate each correction point this many times
    correction_horizon: 10          # + extra query points
    only_correction: False
  seed: 42
  val_ratio: 0.0
  max_train_episodes: 90
