name: wam_pandp-solo-cup_nodmp_2cam_jp-ee

task_name: wam_pandp-solo-cup_nodmp_2cam_jp-ee

image_shape: &image_shape [3, 224, 224]

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    front_img:
        shape: *image_shape
        type: rgb
    wrist_img:
        shape: *image_shape
        type: rgb
    agent_pos:
      shape: [17] # [...7dofjp, ...ee pos, ...2x3 rows of rotation matrix, gripper pos]
      type: low_dim
    ext_torque:
      shape: [7]
      type: low_dim
    policy:
      shape: [7] # last policy jp
      type: low_dim
  action:
    shape: [15]

env_runner:
  _target_: diffusion_policy_3d.env_runner.udp_runner.UdpRunner
  remote_ip: "127.0.0.1"
  follower_send_port: 20000
  leader_send_port: 10000
  recv_port: 6554
  wrist_cam_serial: "18475182"
  front_cam_serial: "18475176"
  dof: 7
  loop_hz: 10
  debug: False
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  horizon: ${horizon}

dataset:
  _target_: diffusion_policy_3d.dataset.lab_real_async_dataset.LabRealAsyncDataset
  zarr_path: /mnt/10tb/serg/FlowMatching/data_wam/wam_pandp-solo-cup_nodmp-100-1_jp-ee.zarr
  action_horizon: ${n_action_steps}
  action_padding: False
  obs_key_horizons:
    state:
      horizon: 3
      down_sample_steps: 1
      source: low_dim
    ext_torque:
      horizon: 32
      down_sample_steps: 4
      source: low_dim
    policy:
      horizon: 6
      down_sample_steps: 50
      source: low_dim
    front_img:
      horizon: ${n_obs_steps}
      down_sample_steps: 1
      source: img
    wrist_img:
      horizon: ${n_obs_steps}
      down_sample_steps: 1
      source: img
  seed: 42
  val_ratio: 0.0
  max_train_episodes: 90
  weighted: False
