name: wam_pandp-solo-cup_nodmp_2cam_jp-ee

task_name: wam_pandp-solo-cup_nodmp_2cam_jp-ee

image_shape: &image_shape [3, 224, 224]

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    front_img:
        shape: *image_shape
        type: rgb
    wrist_img:
        shape: *image_shape
        type: rgb
    agent_pos:
      shape: [17] # [...7dofjp, ...ee pos, ...2x3 rows of rotation matrix, gripper pos]
      type: low_dim
    ext_torque:
      shape: [7]
      type: low_dim
  action:
    shape: [15]

env_runner:
  _target_: diffusion_policy_3d.env_runner.udp_runner.UdpRunner
  remote_ip: "127.0.0.1"
  follower_send_port: 20000
  leader_send_port: 10000
  recv_port: 6554
  wrist_cam_serial: "18475182"
  front_cam_serial: "18475176"
  dof: 7
  loop_hz: 10
  debug: False
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  horizon: ${horizon}

dataset:
  _target_: diffusion_policy_3d.dataset.lab_real_dataset.LabRealDataset
  zarr_path: /mnt/10tb/serg/FlowMatching/data_wam/wam_pandp-solo-cup-nodmp-100_jp-ee.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.0
  max_train_episodes: 90
