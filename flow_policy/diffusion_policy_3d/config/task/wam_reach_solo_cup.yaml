name: wam_reach_solo_cup

task_name: wam_reach_solo_cup

image_shape: &image_shape [3, 84, 84]

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    front_img:
        shape: *image_shape
        type: rgb
    wrist_img:
        shape: *image_shape
        type: rgb
    agent_pos:
      shape: [8]
      type: low_dimx
  action:
    shape: [7]

env_runner:
  _target_: diffusion_policy_3d.env_runner.udp_runner.UdpRunner
  remote_ip: "127.0.0.1"
  send_port: 6666
  recv_port: 6554
  wrist_cam_serial: "18475182"
  front_cam_serial: "18475176"
  dof: 7
  action_horizon: 5
  loop_hz: 10
  debug: False

dataset:
  _target_: diffusion_policy_3d.dataset.lab_real_dataset.LabRealDataset
  zarr_path: data_wam/reach_solo_cup.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.0
  max_train_episodes: 90
