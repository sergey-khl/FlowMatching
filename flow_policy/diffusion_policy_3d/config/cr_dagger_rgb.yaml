defaults:
  - task: franka_banana

name: train_cr_dagger


task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "debug"

output_dir: /mnt/10tb/serg/FlowMatching/outputs/${name}_${task_name}

horizon: 5
n_obs_steps: 1
n_action_steps: 5
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy_3d.policy.cr_dagger_rgb.CrDaggerRGB
  use_point_crop: true
  condition_type: film
  weighted_loss: false
  batched_weights: false

  mlp_cfg:
    action_horizon: ${horizon}
    hidden_dims: [256, 256, 256]
    dropout: 0.1

  
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}

  shape_meta: ${shape_meta}

  use_depth: False
  use_depth_only: False
  obs_encoder:
    _target_: diffusion_policy_3d.model.vision.timm_obs_encoder_with_force.TimmObsEncoderWithForce
    shape_meta: ${shape_meta}
    fuse_mode: modality-attention
    reduce_pretrained_lr: True

    base_policy_ckpt: /mnt/10tb/serg/FlowMatching/outputs/train_rtc_flowmatch_wam_pandp-apple_base_2cam/checkpoints/wam_pandp-apple_base_2cam-epoch=0300-test_mean_score=-0.014.ckpt

    ##### from scratch #####
    # model_name: 'vit_base_patch16_224'
    # model_name: 'resnet34'
    # model_name: 'vit_tiny_patch16_224'
    # model_name: 'efficientnet_b0'
    # model_name: 'efficientnet_b3'
    # pretrained: False
    # frozen: False

    vision_encoder_cfg:   # TODO: load this from base policy
      ##### from scratch #####
      # model_name: 'resnet34.a1_in1k'
      model_name: 'vit_base_patch32_clip_224.openai'
      # model_name: 'convnext_base.clip_laion2b_augreg_ft_in12k'
      pretrained: True
      frozen: True
      global_pool: ''

      # 'avg' or 'max' or 'soft_attention' or 'spatial_embedding' or 'transformer' or 'attention_pool_2d'
      feature_aggregation: 'attention_pool_2d'
      # feature_aggregation: null
      position_encoding: null

      # it only works for resnet. 32 (7x7) or 16 (14x14)
      downsample_ratio: 32

      transforms:
        - type: RandomCrop
          ratio: 0.95
        # RandomRotation is not compatible with BF16
        # - _target_: torchvision.transforms.RandomRotation
        #   degrees:
        #     - -5.0
        #     - 5.0
        #   expand: false
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.3
          contrast: 0.4
          saturation: 0.5
          hue: 0.08
        # - _target_: torchvision.transforms.RandomPerspective
        #   distortion_scale: 0.5
        #   p: 1.0
        # - _target_: torchvision.transforms.ElasticTransform
        #   alpha: 50.0
        #   sigma: 5.0
        # - _target_: torchvision.transforms.RandomPerspective
        #   distortion_scale: 0.5
        #   p: 1.0
        # - _target_: torchvision.transforms.ElasticTransform
        #   alpha: 50.0
        #   sigma: 5.0
        # - _target_: torchvision.transforms.RandomCrop
        #   size: 192

      use_group_norm: True
      share_rgb_model: False
      imagenet_norm: True
    
    force_encoder_cfg:
      model_name: causalconv
      feature_dim: 768
      frozen: False
      pretrained: False
      use_group_norm: False
      share_force_model: False

# TODO: make not gross
base_policy:
  _target_: diffusion_policy_3d.policy.rtc_flow_match_rgb.RTCFlowMatchingRGB
  use_point_crop: true
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true
  weighted_loss: false
  
  diffusion_step_embed_dim: 128
  down_dims:
  - 128
  - 256
  - 512
  crop_shape:
  - 80
  - 80
  horizon: ${horizon}
  kernel_size: 5
  n_action_steps: ${n_action_steps}
  n_groups: 8
  n_obs_steps: ${n_obs_steps}

  num_inference_steps: 10
  obs_as_global_cond: true
  shape_meta: ${shape_meta}

  max_delay: 4

  use_depth: False
  use_depth_only: False
  obs_encoder:
    _target_: diffusion_policy_3d.model.vision.timm_obs_encoder.TimmObsEncoder
    shape_meta: ${shape_meta}

    model_name: 'r3m'
    pretrained: True
    frozen: False

    global_pool: ''

    feature_aggregation: null
    position_encording: 'sinusoidal' # 'learnable' or 'sinusoidal'. it only works for transformer

    downsample_ratio: 32

    transforms:
      - type: RandomCrop
        ratio: 0.95
      - _target_: torchvision.transforms.RandomRotation
        degrees:
          - -5.0
          - 5.0
        expand: false
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.3
        contrast: 0.4
        saturation: 0.5
        hue: 0.08
     

    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

ema:
  _target_: diffusion_policy_3d.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  # batch_size: 120
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  # batch_size: 120
  batch_size: 64
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 501
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 600
  checkpoint_every: 50
  val_every: 100
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  save_video: True

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: rtc_flow_match-${task.name}-${training.seed}
  project: dp3-flow
  resume: true
  tags:
  - dp3-flow


checkpoint:
  save_ckpt: True # if True, save checkpoint every checkpoint_every
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 15
    format_str: '${task.task_name}-epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True # this only saves when save_ckpt is True
  save_last_snapshot: False
  tag: 300 # which checkpoint to load for eval, one of [latest | best | <epoch>]

multi_run:
  run_dir: ${output_dir}/${now:%Y.%m.%d}/${now:%H.%M.%S}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: ${output_dir}/${now:%Y.%m.%d}/${now:%H.%M.%S}
  sweep:
    dir: ${output_dir}/${now:%Y.%m.%d}/${now:%H.%M.%S}
    subdir: ${hydra.job.num}
