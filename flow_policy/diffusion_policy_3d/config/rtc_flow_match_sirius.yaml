defaults:
  - task: franka_banana

name: train_rtc_flowmatch


task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "debug"

# horizon: 4
horizon: 16
n_obs_steps: 2
# n_action_steps: 3
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy_3d.policy.rtc_flow_match.RTCFlowMatching
  use_point_crop: true
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true
  weighted_loss: true
  
  diffusion_step_embed_dim: 128
  down_dims:
  - 128
  - 256
  - 512
  crop_shape:
  - 80
  - 80
  horizon: ${horizon}
  kernel_size: 5
  n_action_steps: ${n_action_steps}
  n_groups: 8
  n_obs_steps: ${n_obs_steps}

  num_inference_steps: 10
  obs_as_global_cond: true
  shape_meta: ${shape_meta}

  max_delay: 4

  # whether to use point cloud's color
  use_pc_color: true
  # type of pointnet
  pointnet_type: "multi_stage_pointnet"
  point_downsample: true

  # NOTE: this uses wayy more VRAM than before. Need smaller batch size now.
  pointcloud_encoder_cfg:
    in_channels: 6
    out_channels: 128
    use_layernorm: true
    final_norm: layernorm # layernorm, none
    normal_channel: false
    num_points: 4096


ema:
  _target_: diffusion_policy_3d.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  # batch_size: 120
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  # batch_size: 120
  batch_size: 64
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 51
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 400
  checkpoint_every: 5
  val_every: 100
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  save_video: True
  # SIRIUS SPECIFIC
  sirius_finetune: True
  finetune_checkpoint_path: None # pass this in through bash script
  # ----

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: rtc_flow_match-${task.name}-${training.seed}
  project: dp3-flow
  resume: true
  tags:
  - dp3-flow


checkpoint:
  save_ckpt: True # if True, save checkpoint every checkpoint_every
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 15
    format_str: '${task.task_name}-epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True # this only saves when save_ckpt is True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
